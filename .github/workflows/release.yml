name: Release

# Release to itch.io (kniti/gab). Bumps the patch version, builds all three
# OSes, and uploads the portable build (+ installer) to itch.io via butler. It
# does NOT create a GitHub Release.
#
# Runs automatically on every push to main that touches something shippable, and
# on demand from Actions → Release → "Run workflow". `paths-ignore` is what keeps
# a README fix from cutting a version on a public storefront — the trigger list
# below is the whole policy, so widen it carefully.
#
# Versioning is tag-driven: the next version is the latest `vX.Y.Z` tag with its
# patch incremented (the first release uses the version in package.json). After a
# successful upload the bump is committed back to main and a lightweight git tag
# records it — no GitHub Release is created either way.
#
# The commit-back is load-bearing, not bookkeeping. The build jobs stamp the
# version into their own throwaway workspaces, so without it the repo keeps
# whatever package.json last said and every build that is NOT this workflow
# reports that stale number in the About dialog — a local `npm run tauri build`,
# `npm run export` (and the VERSION.txt beside it), or a licensee building from
# source, all of which read package.json exactly as vite.config.ts does.
#
# Requires a BUTLER_API_KEY repository secret
# (https://itch.io/user/settings/api-keys). Without it the workflow still builds,
# but the itch upload and the version tag are skipped.
#
# "Paid" is an itch.io setting, not something CI controls: set the price on the
# game's Edit page (Pricing → "$X or more" or a fixed price) and publish it.
# butler only uploads builds; itch puts them behind the paywall automatically for
# a paid game.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    # Documentation, licence text and the CI definition itself ship nothing, so
    # they must not burn three 45-minute platform builds or advance the version
    # on itch. A push that touches BOTH a doc and any source file still releases
    # — paths-ignore only skips a push whose every changed file matches.
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - ".github/**"

permissions:
  contents: write

# One release at a time. Two pushes in quick succession would otherwise both
# read the same latest tag (it is only written at the very end, ~45 minutes in),
# claim the same version, and race to push the same tag — the loser failing
# after a full build. Queued rather than cancelled: a run that is already
# uploading to itch must be allowed to finish and tag itself.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap gate first: a typecheck or unit-test failure should not cost three
  # 45-minute platform builds to discover. The attribution check needs extracted
  # crate sources, so it runs in the Windows build job instead (see below).
  check:
    # Don't release our own release. The last job pushes a `chore(release): vX`
    # bump back to main, and on a push trigger that commit would otherwise start
    # the next release, which bumps and pushes again, forever.
    #
    # GitHub already breaks this loop — a push made with the default
    # GITHUB_TOKEN does not trigger workflow runs — but that is an implicit rule
    # about the CREDENTIAL, and it silently stops applying the day the push
    # switches to a PAT or a deploy key (the usual fix for branch protection).
    # This condition holds regardless of who pushed. Both root jobs carry it;
    # skipping them skips everything downstream via `needs`.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  version:
    # Same loop guard as `check` above — see the reasoning there.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need all tags to find the latest
      - id: v
        shell: bash
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            version=$(node -p "require('./package.json').version")
            echo "No tags yet — first release uses package.json version $version"
          else
            base=${latest#v}
            IFS='.' read -r MA MI PA <<< "$base"
            version="$MA.$MI.$((PA + 1))"
            echo "Latest tag $latest — bumping to $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    # At job level so steps can branch on it in `if:` — a secret can't be read
    # from an expression directly, only through the env context.
    env:
      GAB_SIGN_METHOD: ${{ secrets.GAB_SIGN_METHOD }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            libasound2-dev \
            file wget curl

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Every file that reports a version, not just tauri.conf.json: the
      # installer version comes from the Tauri config, but the About dialog's
      # build stamp is baked in from package.json by vite.config.ts. Stamping one
      # and not the other ships an installer and an app that disagree about what
      # version they are. See scripts/stamp-version.mjs for who reads what.
      - name: Stamp release version
        shell: bash
        run: node scripts/stamp-version.mjs "${{ needs.version.outputs.version }}"

      - name: Install frontend dependencies
        run: npm ci

      # Azure Trusted Signing runs through Microsoft's `sign` dotnet global tool,
      # which is not on the runner image — without this, scripts/sign.ps1 throws
      # "'sign' tool not found" and the bundle step dies with the unhelpful
      # "failed to run powershell". All published versions are prerelease.
      - name: Install the Trusted Signing tool
        if: matrix.platform == 'windows-latest' && env.GAB_SIGN_METHOD == 'trustedsigning'
        run: dotnet tool install --global sign --prerelease

      - name: Build the app (no GitHub Release — itch.io only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing. scripts/sign.ps1 is invoked per-binary via the
          # signCommand in src-tauri/tauri.windows.conf.json (auto-merged on
          # Windows), and no-ops when GAB_SIGN_METHOD is unset — so an
          # unconfigured repo still produces working, unsigned installers.
          # GAB_SIGN_METHOD comes from the job-level env above.
          GAB_SIGN_ENDPOINT: ${{ secrets.GAB_SIGN_ENDPOINT }}
          GAB_SIGN_ACCOUNT: ${{ secrets.GAB_SIGN_ACCOUNT }}
          GAB_SIGN_PROFILE: ${{ secrets.GAB_SIGN_PROFILE }}
          GAB_SIGN_THUMBPRINT: ${{ secrets.GAB_SIGN_THUMBPRINT }}
          GAB_SIGN_COMMAND: ${{ secrets.GAB_SIGN_COMMAND }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          args: ${{ matrix.args }}

      # Tauri discards the sign command's output, so a signing failure surfaces
      # only as "failed to run powershell". sign.ps1 mirrors every run here.
      - name: Show the signing log
        if: failure() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path sign.log) { Get-Content sign.log }
          else { Write-Host "no sign.log — scripts/sign.ps1 never ran (check the signCommand in tauri.windows.conf.json)" }

      # Fails the release if a dependency changed without THIRD-PARTY-LICENSES.md
      # being regenerated — stale attributions look like compliance while not
      # being it. The generator unpacks the crate sources it reads itself (via
      # cargo metadata): a Windows build only unpacks the crates it compiles, so
      # the Linux/macOS half of the lock would otherwise read as UNKNOWN here and
      # fail the check on a file that is perfectly current.
      - name: Verify third-party attributions are current
        if: matrix.platform == 'windows-latest'
        run: npm run licenses:check

      - name: Stage itch.io uploads
        shell: bash
        run: |
          set -e
          mkdir -p itch
          case "$RUNNER_OS" in
            Windows)
              # Portable exe (runs in portable mode, keeping its data beside it).
              cp "src-tauri/target/release/Game Asset Browser.exe" "itch/GameAssetBrowser-portable.exe"
              s=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -n1 || true)
              [ -n "$s" ] && cp "$s" "itch/GameAssetBrowser-setup.exe" || echo "no NSIS installer"
              ;;
            Linux)
              a=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n1 || true)
              [ -n "$a" ] && cp "$a" "itch/GameAssetBrowser.AppImage" || echo "no AppImage"
              d=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -n1 || true)
              [ -n "$d" ] && cp "$d" "itch/GameAssetBrowser.deb" || echo "no .deb"
              ;;
            macOS)
              m=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -n1 || true)
              [ -n "$m" ] && cp "$m" "itch/GameAssetBrowser.dmg" || echo "no .dmg"
              ;;
          esac
          # The MIT/Apache-2.0 notices have to travel with the binary. The app
          # also embeds them (About → Show full attributions), but a plain file
          # beside the download is what a compliance reviewer looks for.
          cp THIRD-PARTY-LICENSES.md LICENSE.md itch/ 2>/dev/null || true
          ls -la itch

      - name: Upload itch staging artifact
        uses: actions/upload-artifact@v5
        with:
          name: itch-${{ matrix.platform }}
          path: itch/
          if-no-files-found: warn

  itch:
    needs: [version, build]
    runs-on: ubuntu-latest
    # secrets can't be read in a step `if`, but referencing one in `env` is
    # allowed — so gate every step on this instead of hard-failing when unset.
    env:
      HAS_BUTLER: ${{ secrets.BUTLER_API_KEY != '' }}
    steps:
      - name: Note if the itch secret is missing
        if: env.HAS_BUTLER != 'true'
        run: echo "::warning::BUTLER_API_KEY secret is not set — skipping itch.io upload. Add it under Settings → Secrets and variables → Actions."

      # fetch-depth: 0 because the bump below pushes a new COMMIT. A shallow
      # clone can push a tag that points at a commit the remote already has, but
      # a commit of its own is refused as a shallow update.
      - name: Checkout (to commit the bump and tag the release)
        if: env.HAS_BUTLER == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build artifacts
        if: env.HAS_BUTLER == 'true'
        uses: actions/download-artifact@v5
        with:
          path: dl

      - name: Install butler
        if: env.HAS_BUTLER == 'true'
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        if: env.HAS_BUTLER == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          V="${{ needs.version.outputs.version }}"
          push() { if [ -f "$1" ]; then echo "-> $2"; ./butler push "$1" "kniti/gab:$2" --userversion "$V"; else echo "skip $2 (missing $1)"; fi; }
          push dl/itch-windows-latest/GameAssetBrowser-portable.exe windows
          push dl/itch-windows-latest/GameAssetBrowser-setup.exe    windows-setup
          push dl/itch-ubuntu-22.04/GameAssetBrowser.AppImage       linux
          push dl/itch-ubuntu-22.04/GameAssetBrowser.deb            linux-deb
          push dl/itch-macos-latest/GameAssetBrowser.dmg            osx

      # The same stamp the build jobs applied, re-run here because their
      # workspaces are long gone — this is the copy that gets committed, so the
      # repo ends up saying what the shipped build says.
      - name: Commit the version bump and tag the release
        if: env.HAS_BUTLER == 'true'
        env:
          V: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bump the CURRENT tip of main, not the commit this run was triggered
          # by. Under the automatic trigger those routinely differ: runs queue on
          # the `release` concurrency group, so by the time a queued run gets
          # here the previous run has already bumped main and this run's own
          # checkout is behind it.
          #
          # Re-stamping the tip is what makes that safe. Committing on the built
          # commit and replaying it forward cannot work — both bumps rewrite the
          # same version line from the same base ("0.1.6" -> "0.1.7" and
          # "0.1.6" -> "0.1.8"), so the replay conflicts every time. Generating
          # the bump against whatever is there has no such base to disagree with.
          #
          # The cost is that the tagged tree is main-at-release-time rather than
          # the exact tree that was built, when someone pushed during the ~45 min
          # build. That is the right trade: main carrying the shipped version is
          # load-bearing (see the header — every non-CI build reads package.json),
          # whereas the tag's only job is to tell the next run what to bump from.
          git fetch origin main
          git checkout -B main origin/main

          node scripts/stamp-version.mjs "$V"
          git add package.json package-lock.json src-tauri/tauri.conf.json
          git commit -m "chore(release): v$V"

          # Lightweight tag only — this is NOT a GitHub Release; it just lets the
          # next run compute the following patch version. It sits on the bump
          # commit, so the tagged tree is the one that claims that version.
          git tag "$TAG"

          # Push the tag first and on its own: it is what the next run reads, so
          # it must land even if the branch update cannot. Fast-forwarding main
          # is the convenience half — if main moved in the seconds since the
          # fetch (or branch protection refuses the push) a warning is the right
          # outcome, because the release is already out and correctly tagged.
          git push origin "$TAG"
          git push origin HEAD:main \
            || echo "::warning::main moved during the release — $TAG is released and tagged, but the version bump did not merge. Apply it with: git cherry-pick $TAG"
